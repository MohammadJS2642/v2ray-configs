name: Update VPN Subscriptions

on:
  schedule:
    - cron: "0 */3 * * *" # هر 3 ساعت یکبار
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pybase64 requests

      - name: Run script
        run: |
          cd Files
          python app.py
          cd .. # بازگشت به پوشه اصلی برای اطمینان از دسترسی گیت به همه فایل‌ها

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          
          # اضافه کردن تمام تغییرات
          git add .
          
          # فقط اگر تغییری وجود داشت کامیت کن (جلوگیری از خطای Empty Commit)
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto Update Subscriptions"
            
            # بخش حیاتی: گرفتن آخرین تغییرات و سوار کردن تغییرات جدید روی آن‌ها
            git pull --rebase origin main
            
            # پوش نهایی
            git push origin main
          fi
