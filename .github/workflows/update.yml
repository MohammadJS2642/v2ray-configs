name: Update VPN Subscriptions

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: update-vpn-subscriptions
      cancel-in-progress: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pybase64 requests

      - name: Run script
        run: |
          cd Files
          python app.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .

          if git diff --staged --quiet; then
            echo "No changes to commit"
          exit 0
          fi

          git commit -m "Auto Update Subscriptions"

          # گرفتن آخرین تغییرات از ریموت و اعمال کامیت روی آن
          git pull --rebase origin main

          git push origin main
